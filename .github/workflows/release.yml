name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.9'

    - name: Get next semantic version
      id: version
      run: |
        # Get the latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Latest tag: $LATEST_TAG"
        
        # Parse version components
        VERSION=${LATEST_TAG#v}
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        
        # Get commit messages since last tag
        if [ "$LATEST_TAG" = "v0.0.0" ]; then
          COMMITS=$(git log --oneline)
        else
          COMMITS=$(git log ${LATEST_TAG}..HEAD --oneline)
        fi
        
        # Determine version bump based on conventional commits
        if echo "$COMMITS" | grep -qiE "^[a-f0-9]+ (BREAKING CHANGE|feat!|fix!|refactor!)"; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
        elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+ feat"; then
          MINOR=$((MINOR + 1))
          PATCH=0
        else
          PATCH=$((PATCH + 1))
        fi
        
        NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
        echo "New version: $NEW_VERSION"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Build and package binaries
      run: |
        # Build all binaries
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o leakjs ./cmd/leakjs
        chmod +x leakjs
        zip leakjs-linux-amd64.zip leakjs
        rm leakjs

        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o leakjs ./cmd/leakjs
        chmod +x leakjs
        zip leakjs-linux-arm64.zip leakjs
        rm leakjs

        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o leakjs ./cmd/leakjs
        chmod +x leakjs
        zip leakjs-macos-amd64.zip leakjs
        rm leakjs

        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o leakjs ./cmd/leakjs
        chmod +x leakjs
        zip leakjs-macos-arm64.zip leakjs
        rm leakjs

        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o leakjs.exe ./cmd/leakjs
        zip leakjs-windows-amd64.zip leakjs.exe
        rm leakjs.exe

        GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o leakjs.exe ./cmd/leakjs
        zip leakjs-windows-arm64.zip leakjs.exe
        rm leakjs.exe

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          leakjs-linux-amd64.zip
          leakjs-linux-arm64.zip
          leakjs-macos-amd64.zip
          leakjs-macos-arm64.zip
          leakjs-windows-amd64.zip
          leakjs-windows-arm64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}